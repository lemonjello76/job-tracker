<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e40af"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9fafb"/>
      <stop offset="0.45" stop-color="#9ca3af"/>
      <stop offset="0.55" stop-color="#6b7280"/>
      <stop offset="1" stop-color="#374151"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Misting nozzle body -->
  <g transform="translate(256, 175)">
    <!-- Hex flats top -->
    <polygon points="-34,-60 -34,-25 0,-8 34,-25 34,-60 0,-78"
             fill="url(#metal)" stroke="#1f2937" stroke-width="2.5"/>
    <!-- Cylindrical threaded body -->
    <rect x="-26" y="-25" width="52" height="68" rx="2"
          fill="url(#metal)" stroke="#1f2937" stroke-width="2.5"/>
    <!-- Threads -->
    <line x1="-26" y1="-13" x2="26" y2="-13" stroke="#1f2937" stroke-width="1.5" opacity="0.55"/>
    <line x1="-26" y1="-1"  x2="26" y2="-1"  stroke="#1f2937" stroke-width="1.5" opacity="0.55"/>
    <line x1="-26" y1="11"  x2="26" y2="11"  stroke="#1f2937" stroke-width="1.5" opacity="0.55"/>
    <line x1="-26" y1="23"  x2="26" y2="23"  stroke="#1f2937" stroke-width="1.5" opacity="0.55"/>
    <line x1="-26" y1="35"  x2="26" y2="35"  stroke="#1f2937" stroke-width="1.5" opacity="0.55"/>
    <!-- Tip / orifice housing -->
    <rect x="-19" y="43" width="38" height="22" rx="1"
          fill="url(#metal)" stroke="#1f2937" stroke-width="2.5"/>
    <!-- Orifice -->
    <circle cx="0" cy="65" r="4" fill="#0f172a"/>
  </g>

  <!-- Mist spray fan -->
  <g fill="#ffffff">
    <!-- Inner dense cone (high opacity) -->
    <g opacity="0.95">
      <ellipse cx="256" cy="282" rx="3.2" ry="6.5"/>
      <ellipse cx="244" cy="305" rx="3.2" ry="7" transform="rotate(-14 244 305)"/>
      <ellipse cx="268" cy="305" rx="3.2" ry="7" transform="rotate(14 268 305)"/>
      <ellipse cx="232" cy="338" rx="3" ry="7.5" transform="rotate(-22 232 338)"/>
      <ellipse cx="280" cy="338" rx="3" ry="7.5" transform="rotate(22 280 338)"/>
      <ellipse cx="256" cy="338" rx="3" ry="7.5"/>
    </g>
    <!-- Mid mist droplets -->
    <g opacity="0.9">
      <circle cx="218" cy="372" r="3.2"/>
      <circle cx="244" cy="376" r="2.7"/>
      <circle cx="268" cy="376" r="2.7"/>
      <circle cx="294" cy="372" r="3.2"/>
      <circle cx="205" cy="398" r="2.6"/>
      <circle cx="230" cy="402" r="2.2"/>
      <circle cx="256" cy="404" r="2.4"/>
      <circle cx="282" cy="402" r="2.2"/>
      <circle cx="307" cy="398" r="2.6"/>
    </g>
    <!-- Far-field mist (fine) -->
    <g opacity="0.78">
      <circle cx="188" cy="422" r="2.1"/>
      <circle cx="214" cy="430" r="1.9"/>
      <circle cx="240" cy="434" r="1.6"/>
      <circle cx="266" cy="436" r="1.7"/>
      <circle cx="292" cy="434" r="1.6"/>
      <circle cx="318" cy="430" r="1.9"/>
      <circle cx="343" cy="422" r="2.1"/>
    </g>
    <!-- Outermost scatter -->
    <g opacity="0.6">
      <circle cx="178" cy="452" r="1.5"/>
      <circle cx="204" cy="458" r="1.3"/>
      <circle cx="228" cy="462" r="1.4"/>
      <circle cx="256" cy="464" r="1.4"/>
      <circle cx="284" cy="462" r="1.4"/>
      <circle cx="307" cy="458" r="1.3"/>
      <circle cx="334" cy="452" r="1.5"/>
    </g>
  </g>
</svg>
